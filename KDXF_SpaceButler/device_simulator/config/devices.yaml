devices:
  bedroom_reading_light:
    type: light
    name: 卧室阅读灯
    room: bedroom
    initial_state:
      power: "OFF"
      brightness: 0
    capabilities:
      brightness: true
    behavior:
      command_delay_ms: 120
      failure_rate: 0
  living_room_main_light:
    type: light
    name: 客厅主灯
    room: living_room
    initial_state:
      power: "ON"
      brightness: 204
    capabilities:
      brightness: true
    behavior:
      command_delay_ms: 200
      failure_rate: 0
  living_room_curtain:
    type: curtain
    name: 客厅窗帘
    room: living_room
    initial_state:
      position: 100
      target_position: 100
      status: open
    behavior:
      command_delay_ms: 100
      move_duration_ms: 800
      failure_rate: 0
  living_room_ac:
    type: climate
    name: 客厅空调
    room: living_room
    initial_state:
      mode: cool
      temperature: 24
      current_temperature: 27
    behavior:
      command_delay_ms: 200
      failure_rate: 0
  living_room_presence_sensor:
    type: presence
    name: 客厅人体存在传感器
    room: living_room
    initial_state:
      occupied: false
      unoccupied_minutes: 23
    behavior:
      command_delay_ms: 0
      failure_rate: 0
  living_room_window_sensor:
    type: contact
    name: 客厅窗户传感器
    room: living_room
    initial_state:
      open: true
    behavior:
      command_delay_ms: 0
      failure_rate: 0
  living_room_tv:
    type: switch
    name: 客厅电视
    room: living_room
    initial_state:
      power: "OFF"
      power_w: 1.5
    behavior:
      command_delay_ms: 150
      failure_rate: 0
