edgehome_set_curtain_fault:
  url: http://device-simulator:8090/admin/devices/living_room_curtain/fault
  method: POST
  headers:
    content-type: application/json
  payload: >-
    {"mode":"{{ mode | default('none') }}","delay_ms":{{ delay_ms | default(0) }}}

# 通过 Home Assistant 容器内的网络调用模拟设备重置接口。避免浏览器或宿主机
# 直连调试端口，使演示工作台的“恢复初始状态”在标准 docker compose 部署中可用。
edgehome_reset_mqtt_main_light:
  url: http://device-simulator:8090/admin/devices/living_room_main_light/reset
  method: POST
  headers:
    content-type: application/json
  payload: "{}"

edgehome_reset_mqtt_curtain:
  url: http://device-simulator:8090/admin/devices/living_room_curtain/reset
  method: POST
  headers:
    content-type: application/json
  payload: "{}"

edgehome_reset_mqtt_ac:
  url: http://device-simulator:8090/admin/devices/living_room_ac/reset
  method: POST
  headers:
    content-type: application/json
  payload: "{}"

edgehome_reset_mqtt_tv:
  url: http://device-simulator:8090/admin/devices/living_room_tv/reset
  method: POST
  headers:
    content-type: application/json
  payload: "{}"
