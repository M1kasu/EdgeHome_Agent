# 可控的虚拟家居实体。default_entity_id 让实体 ID 在首次加载时保持稳定。
- light:
    - name: 客厅主灯
      unique_id: edgehome_living_room_main
      default_entity_id: light.edgehome_living_room_main
      state: "{{ is_state('input_boolean.edgehome_living_room_main_power', 'on') }}"
      level: "{{ (states('input_number.edgehome_living_room_main_brightness') | float(0) * 255 / 100) | round(0) }}"
      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.edgehome_living_room_main_power
      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.edgehome_living_room_main_power
      set_level:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.edgehome_living_room_main_power
        - action: input_number.set_value
          target:
            entity_id: input_number.edgehome_living_room_main_brightness
          data:
            value: "{{ (brightness | int(0) * 100 / 255) | round(0) }}"
    - name: 客厅氛围灯
      unique_id: edgehome_living_room_ambient
      default_entity_id: light.edgehome_living_room_ambient
      state: "{{ is_state('input_boolean.edgehome_living_room_ambient_power', 'on') }}"
      level: "{{ (states('input_number.edgehome_living_room_ambient_brightness') | float(0) * 255 / 100) | round(0) }}"
      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.edgehome_living_room_ambient_power
      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.edgehome_living_room_ambient_power
      set_level:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.edgehome_living_room_ambient_power
        - action: input_number.set_value
          target:
            entity_id: input_number.edgehome_living_room_ambient_brightness
          data:
            value: "{{ (brightness | int(0) * 100 / 255) | round(0) }}"
    - name: 卧室主灯
      unique_id: edgehome_bedroom_main
      default_entity_id: light.edgehome_bedroom_main
      state: "{{ is_state('input_boolean.edgehome_bedroom_main_power', 'on') }}"
      level: "{{ (states('input_number.edgehome_bedroom_main_brightness') | float(0) * 255 / 100) | round(0) }}"
      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.edgehome_bedroom_main_power
      turn_off:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.edgehome_bedroom_main_power
      set_level:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.edgehome_bedroom_main_power
        - action: input_number.set_value
          target:
            entity_id: input_number.edgehome_bedroom_main_brightness
          data:
            value: "{{ (brightness | int(0) * 100 / 255) | round(0) }}"
