- cover:
    - name: 客厅窗帘
      unique_id: edgehome_living_room_curtain
      default_entity_id: cover.edgehome_living_room_curtain
      device_class: curtain
      state: "{{ 'open' if states('input_number.edgehome_living_room_curtain_position') | int(0) > 0 else 'closed' }}"
      position: "{{ states('input_number.edgehome_living_room_curtain_position') | int(0) }}"
      open_cover:
        # 故障注入开启时故意不更新位置：HA 服务仍成功返回，供回读校验捕获失败。
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.edgehome_simulate_curtain_failure
                  state: "off"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.edgehome_living_room_curtain_position
                  data:
                    value: 100
      close_cover:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.edgehome_simulate_curtain_failure
                  state: "off"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.edgehome_living_room_curtain_position
                  data:
                    value: 0
      set_cover_position:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.edgehome_simulate_curtain_failure
                  state: "off"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.edgehome_living_room_curtain_position
                  data:
                    value: "{{ position | int(0) }}"
- sensor:
    - name: 客厅温度
      unique_id: edgehome_living_room_temperature
      default_entity_id: sensor.edgehome_living_room_temperature
      device_class: temperature
      unit_of_measurement: "°C"
      state: "{{ states('input_number.edgehome_living_room_temperature_value') | float(0) }}"
    - name: 客厅光照
      unique_id: edgehome_living_room_illuminance
      default_entity_id: sensor.edgehome_living_room_illuminance
      device_class: illuminance
      unit_of_measurement: lx
      state: "{{ states('input_number.edgehome_living_room_illuminance_value') | int(0) }}"
    - name: 卧室温度
      unique_id: edgehome_bedroom_temperature
      default_entity_id: sensor.edgehome_bedroom_temperature
      device_class: temperature
      unit_of_measurement: "°C"
      state: "{{ states('input_number.edgehome_bedroom_temperature_value') | float(0) }}"
- binary_sensor:
    - name: 客厅有人
      unique_id: edgehome_living_room_presence
      default_entity_id: binary_sensor.edgehome_living_room_presence
      device_class: presence
      state: "{{ is_state('input_boolean.edgehome_living_room_presence_state', 'on') }}"
    - name: 卧室有人
      unique_id: edgehome_bedroom_presence
      default_entity_id: binary_sensor.edgehome_bedroom_presence
      device_class: presence
      state: "{{ is_state('input_boolean.edgehome_bedroom_presence_state', 'on') }}"
    - name: 窗户
      unique_id: edgehome_window
      default_entity_id: binary_sensor.edgehome_window
      device_class: window
      state: "{{ is_state('input_boolean.edgehome_window_open_state', 'on') }}"
