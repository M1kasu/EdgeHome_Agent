services:
  edgehome-agent:
    build:
      context: ..
      dockerfile: deployment/edgehome-agent/Dockerfile
    volumes:
      - ./homeassistant:/config
    restart: "no"

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    depends_on:
      edgehome-agent:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
    volumes:
      - ./homeassistant:/config
    ports:
      - "${HA_PORT:-8123}:8123"
    restart: unless-stopped

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      MODEL_PATH: ${MODEL_PATH}
      MODEL_CONTEXT_SIZE: ${MODEL_CONTEXT_SIZE}
    volumes:
      - ${MODELS_DIR}:/models:ro
    command:
      - -m
      - ${MODEL_PATH}
      - -c
      - ${MODEL_CONTEXT_SIZE}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${MODEL_PORT:-8080}:8080"
    restart: unless-stopped
