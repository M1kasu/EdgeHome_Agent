services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./runtime/mosquitto/data:/mosquitto/data
      - ./runtime/mosquitto/log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
    restart: unless-stopped
    networks:
      - edgehome

  device-simulator:
    build:
      context: ../device_simulator
    depends_on:
      - mqtt
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      DEVICE_CONFIG: /app/config/devices.yaml
      STATE_DB: /app/data/device_state.db
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8090"
    volumes:
      - ../device_simulator/config:/app/config:ro
      - ./runtime/device-simulator:/app/data
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    networks:
      - edgehome

  edgehome-agent:
    build:
      context: ..
      dockerfile: deployment/edgehome-agent/Dockerfile
    volumes:
      - ./homeassistant:/config
    restart: "no"
    networks:
      - edgehome

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    depends_on:
      edgehome-agent:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    environment:
      TZ: ${TZ}
      # M1.5：结构化会话状态持久化到宿主机 runtime，容器重启后可恢复。
      EDGEHOME_CONTEXT_DB_PATH: /runtime/edgehome_context.db
      # 默认 30 分钟；验收可通过环境变量临时缩短，不改变会话核心逻辑。
      EDGEHOME_CONTEXT_TTL_SECONDS: ${EDGEHOME_CONTEXT_TTL_SECONDS:-1800}
    volumes:
      - ./homeassistant:/config
      - ./runtime:/runtime
    ports:
      - "${HA_PORT:-8123}:8123"
    restart: unless-stopped
    networks:
      - edgehome

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    environment:
      MODEL_PATH: ${MODEL_PATH}
      MODEL_CONTEXT_SIZE: ${MODEL_CONTEXT_SIZE}
    volumes:
      - ${MODELS_DIR}:/models:ro
    command:
      - -m
      - ${MODEL_PATH}
      - -c
      - ${MODEL_CONTEXT_SIZE}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${MODEL_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - edgehome

networks:
  edgehome:
    name: edgehome
